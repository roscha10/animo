events {
    worker_connections 2048;
}

http {
    upstream app {
        server app:3000;
    }

    # Redirigir HTTP a HTTPS
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ——— Dominio Kaimind ———
    server {
        listen 443 ssl;
        server_name animo.kaimindconsulting.com;

        ssl_certificate /etc/letsencrypt/live/animo.kaimindconsulting.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/animo.kaimindconsulting.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

        client_max_body_size 10M;
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

        location / {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
        }
    }

    # ——— Dominio Vikua (agregar cuando tengan el DNS configurado) ———
