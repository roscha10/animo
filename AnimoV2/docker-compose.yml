services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: animo
      POSTGRES_USER: animo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U animo"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://animo:${POSTGRES_PASSWORD}@postgres:5432/animo
      JWT_SECRET: ${JWT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      APP_URL: ${APP_URL}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8000"

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
